<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style/reg.css">
    <link rel="stylesheet" href="./style/footer.css">
    <link rel="stylesheet" href="./style/header.css">

    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="head">
        <img src="./icons/icon.ico" alt="">
        <ul>
            <li class="item"><a href="./index.html">ГОЛОВНА</a></li>
            <li class="item"><a href="./aboutus.html">ПРО НАС</a></li>
            <li class="item"><a href="./buy.html">ЗАБРОНЮВАТИ</a></li>
            <li class="item"><a href="./contacts.html">КОНТАКТИ</a></li>
            <li class="item"><a href="./registration.html">ОСОБИСТИЙ КАБІНЕТ</a></li>
        </ul>
        <div class="language">
            <p>UA</p>
            <div class="language-menu">
                <a href="">UA</a>
                <a href="">EN</a>
            </div>
        </div>
    </header>
        
    <section>
        <article class="text">
            <p>Особистий кабінет</p>
        </article>
        
        <article class="account">
            <div class="avatar">
                <img src="./icons/baseAccountImage.png" class="avatar-icon">
                <button class="butt" style="background-color: #69749B;">Змінити аватар</button>
                <button class="butt" style="background-color: #484A54;">Налаштування</button>
            </div>
            <div class="account-info">
                <p class="info"></p>
                <p class="info">Стать: <span></span></p>
                <p class="info">Дата народження: <span>09.12.2007</span></p>
                <p class="info">Мобільний телефон: <span></span></p>
                <p class="info">Ел. пошта: <span></span></p>
                
            </div>
        </article>

        <div class="logout">
            <button class="logout-button">Вийти</button>
        </div>

        <div class="input">
            <article class="input-registration">
                <div>
                    <form>
                        <p>Рейстрація</p>
                        <input placeholder="name" id="registration-name" type="text">
                        <input placeholder="email" id="registration-email" type="email">
                        <input placeholder="password" id="registration-password" type="password">
                        <button onclick="registration(event)">рейстрація</button>
                    </form>
                </div>
            </article>

            <article class="input-login">
                <div>
                    <form>
                        <p>Вхід</p>
                        <input placeholder="email" id="login-email" type="email">
                        <input placeholder="password" id="login-password" type="password">
                        <button onclick="login(event)">Вход</button>
                    </form>
                </div>
            </article>
        </div>
    </section>

    <footer><p>&copy; 2021 Holiday time. All rights reserved</p></footer>
</body>
<script src="./scripts/accounts.js"></script>
</html>
